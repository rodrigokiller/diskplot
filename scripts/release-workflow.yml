# Builds the installers on GitHub's machines whenever a version tag is pushed,
# and attaches them to that version's release.
#
# This file is parked here because the token used to push this repository has
# no "workflow" scope. To switch it on:
#   1. gh auth refresh -h github.com -s workflow
#   2. move this file to .github/workflows/release.yml, commit and push
# From then on, `npm run release -- patch --ci` only bumps the version and
# pushes the tag; the builds below do the rest.
#
# Windows is the supported system. The Linux and macOS builds are produced but
# have not been tested, and the macOS build is not signed or notarised.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
